<p>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Barlow+Condensed:wght@400;600&display=swap');
.skh-wrap{display:flex;justify-content:center;padding:1.5rem 0;font-family:'Barlow Condensed',sans-serif}
.skh-card{width:100%;max-width:480px;background:#0e1119;border-radius:20px;overflow:hidden;position:relative;border:1px solid #1d2433;box-shadow:0 8px 40px rgba(0,0,0,.45)}
.skh-band{height:5px;background:linear-gradient(90deg,#534ab7,#e24b4a,#ba7517,#0f6e56,#534ab7);background-size:300% 100%;animation:skh-band 6s linear infinite}
.skh-band.paused{animation-play-state:paused}
@keyframes skh-band{to{background-position:300% 0}}
.skh-hero{padding:1.5rem 1.5rem 1rem;display:flex;align-items:center;gap:14px}
.skh-disc{width:70px;height:70px;border-radius:50%;background:#141720;border:2px solid #1d2433;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0;transition:border-color .4s}
.skh-disc.spin{border-color:#534ab7;animation:skh-spin 2.2s linear infinite}
@keyframes skh-spin{to{transform:rotate(360deg)}}
.skh-disc svg{position:relative;z-index:1;transition:all .3s}
.skh-eqbars{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:2px;height:16px;opacity:0;transition:opacity .3s}
.skh-disc.spin .skh-eqbars{opacity:1}
.skh-b{width:3px;border-radius:2px;background:#534ab7}
.skh-b:nth-child(1){height:5px;animation:skh-b 0.5s 0.0s ease-in-out infinite alternate}
.skh-b:nth-child(2){height:10px;animation:skh-b 0.5s 0.1s ease-in-out infinite alternate}
.skh-b:nth-child(3){height:14px;animation:skh-b 0.5s 0.05s ease-in-out infinite alternate}
.skh-b:nth-child(4){height:8px;animation:skh-b 0.5s 0.15s ease-in-out infinite alternate}
.skh-b:nth-child(5){height:11px;animation:skh-b 0.5s 0.08s ease-in-out infinite alternate}
@keyframes skh-b{to{height:3px}}
.skh-info{flex:1;min-width:0}
.skh-name{font-family:'Orbitron',monospace;font-size:16px;font-weight:900;color:#e8eaf0;margin:0 0 2px;letter-spacing:1px;background:linear-gradient(90deg,#00e5c0,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.skh-dj{font-size:13px;color:#6b7a99;margin:0 0 8px}
.skh-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;background:#3c3489;color:#afa9ec;font-size:11px;font-weight:600;letter-spacing:1px;opacity:0;transform:scale(.9);transition:all .3s}
.skh-pill.show{opacity:1;transform:scale(1)}
.skh-dot{width:5px;height:5px;border-radius:50%;background:#afa9ec;animation:skh-pulse 1.2s ease-in-out infinite}
@keyframes skh-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.6)}}
.skh-body{padding:0 1.5rem 1.25rem;display:flex;flex-direction:column;gap:.875rem}
.skh-wave{height:38px;display:flex;align-items:center;gap:2px;overflow:hidden}
.skh-wbar{flex:1;border-radius:2px;background:#1d2433;min-height:3px;transition:height .1s ease,background .3s}
.skh-wave.on .skh-wbar{background:#534ab7}
.skh-status{font-size:12px;color:#6b7a99;min-height:16px;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px}
.skh-status.err{color:#e24b4a}
.skh-ctrl{display:flex;align-items:center;gap:12px}
.skh-playbtn{width:52px;height:52px;border-radius:50%;background:#e8eaf0;color:#07080d;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s,background .2s}
.skh-playbtn:hover{background:#ffffff}
.skh-playbtn:active{transform:scale(.93)}
.skh-playbtn svg{transition:all .2s}
.skh-volcol{flex:1;display:flex;flex-direction:column;gap:5px}
.skh-voltop{display:flex;justify-content:space-between;font-size:11px;color:#6b7a99}
.skh-volcol input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:#1d2433;outline:none;cursor:pointer}
.skh-volcol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#8b5cf6;cursor:pointer}
.skh-footer{padding:.75rem 1.5rem;background:#080b10;display:flex;align-items:center;gap:10px;border-top:1px solid #1d2433}
.skh-url{font-family:monospace;font-size:10px;color:#3a4255;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.skh-copybtn{background:transparent;border:1px solid #1d2433;border-radius:6px;padding:4px 10px;font-size:11px;color:#6b7a99;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s;font-family:'Barlow Condensed',sans-serif;flex-shrink:0}
.skh-copybtn:hover{border-color:#534ab7;color:#afa9ec;background:#1d2433}
</style>
<div class="skh-wrap">
<div class="skh-card">
<div class="skh-band" id="skh-band"></div>
<div class="skh-hero">
<div class="skh-disc" id="skh-disc">
<svg id="skh-dico" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6b7a99" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/><path d="M12 8v4l2 2"/><circle cx="12" cy="12" r="2"/></svg>
<div class="skh-eqbars"><div class="skh-b"></div><div class="skh-b"></div><div class="skh-b"></div><div class="skh-b"></div><div class="skh-b"></div></div>
</div>
<div class="skh-info">
<p class="skh-name">SKYHAWKS</p>
<p class="skh-dj">with DJSmuuff &nbsp;·&nbsp; Pilot Program</p>
<span class="skh-pill" id="skh-pill"><span class="skh-dot"></span>ON AIR</span>
</div>
</div>
<div class="skh-body">
<div class="skh-wave" id="skh-wave"></div>
<p class="skh-status" id="skh-st">Ready — click play to tune in</p>
<div class="skh-ctrl">
<button class="skh-playbtn" id="skh-pb" onclick="skhToggle()" aria-label="Play stream">
<svg id="skh-pi" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
</button>
<div class="skh-volcol">
<div class="skh-voltop"><span id="skh-vlbl">&#9834; Volume</span><span id="skh-vnum">80%</span></div>
<input type="range" min="0" max="100" value="80" step="1" id="skh-vol" oninput="skhVol(this.value)" aria-label="Volume">
</div>
</div>
</div>
<div class="skh-footer">
<span class="skh-url">http://99.9.53.48:8000/stream</span>
<button class="skh-copybtn" onclick="skhCopy()" id="skh-cb">&#128203; <span id="skh-ct">Copy URL</span></button>
</div>
</div>
</div>
<script>
(function(){
var STREAM='http://99.9.53.48:8000/stream';
var audio=null,playing=false,wraf=null;
var disc=document.getElementById('skh-disc');
var dico=document.getElementById('skh-dico');
var band=document.getElementById('skh-band');
var pill=document.getElementById('skh-pill');
var wave=document.getElementById('skh-wave');
var st=document.getElementById('skh-st');
var pb=document.getElementById('skh-pb');
var pi=document.getElementById('skh-pi');
var BARS=48,wbars=[];
for(var i=0;i<BARS;i++){var b=document.createElement('div');b.className='skh-wbar';var h=Math.round(6+Math.abs(Math.sin(i*0.45+Math.random()))*28+Math.random()*6);b.style.height=h+'px';b._base=h;b.style.setProperty('--d',(0.3+Math.random()*0.5).toFixed(2)+'s');wave.appendChild(b);wbars.push(b)}
function togglePlay(){if(!playing)start();else stop()}
window.skhToggle=togglePlay;
function start(){
  st.textContent='Connecting\u2026';st.className='skh-status';
  pi.innerHTML='<animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur=".8s" repeatCount="indefinite"/><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="25 15"/>';
  audio=new Audio(STREAM);audio.crossOrigin='anonymous';audio.volume=document.getElementById('skh-vol').value/100;audio.preload='none';
  audio.addEventListener('playing',onPlay);
  audio.addEventListener('waiting',function(){st.textContent='Buffering\u2026'});
  audio.addEventListener('error',onErr);
  audio.play().catch(onErr);
}
function onPlay(){
  playing=true;
  pi.innerHTML='<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
  pb.setAttribute('aria-label','Pause stream');
  st.textContent='Live \u2014 SkyHawks Radio on air';
  disc.classList.add('spin');
  dico.setAttribute('stroke','#8b5cf6');
  pill.classList.add('show');
  band.classList.remove('paused');
  wave.classList.add('on');
  animWave();
}
function stop(){
  if(audio){audio.pause();audio.src='';audio=null;}
  playing=false;
  pi.innerHTML='<path d="M8 5v14l11-7z"/>';
  pb.setAttribute('aria-label','Play stream');
  st.textContent='Stopped \u2014 click play to resume';
  disc.classList.remove('spin');
  dico.setAttribute('stroke','#6b7a99');
  pill.classList.remove('show');
  band.classList.add('paused');
  wave.classList.remove('on');
  wbars.forEach(function(b){b.style.height=b._base+'px'});
  cancelAnimationFrame(wraf);
}
function onErr(){stop();st.textContent='Stream unavailable \u2014 broadcast may be offline';st.className='skh-status err'}
function animWave(){
  if(!playing)return;
  var t=Date.now()/1000;
  wbars.forEach(function(b,i){b.style.height=Math.round(b._base*.35+b._base*.65*Math.abs(Math.sin(t*2.2+i*0.39)))+'px'});
  wraf=requestAnimationFrame(animWave);
}
window.skhVol=function(v){document.getElementById('skh-vnum').textContent=v+'%';if(audio)audio.volume=v/100};
window.skhCopy=function(){
  navigator.clipboard.writeText(STREAM).then(function(){
    document.getElementById('skh-ct').textContent='Copied!';
    setTimeout(function(){document.getElementById('skh-ct').textContent='Copy URL'},2000);
  }).catch(function(){st.textContent='Stream URL: '+STREAM});
};
})();
</script>
</p>
